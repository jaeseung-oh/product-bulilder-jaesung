
<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>범죄 예방 교육</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&family=Roboto:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>
    <header>
        <h1>범죄 예방 교육</h1>
        <nav>
            <ul>
                <li><a href="#drunk-driving">음주운전</a></li>
                <li><a href="#violence">폭력</a></li>
                <li><a href="#sex-crimes">성범죄</a></li>
                <li><a href="#partnership">제휴 문의</a></li>
            </ul>
        </nav>
        <button id="theme-toggle">테마 전환</button>
    </header>

    <main>
        <crime-section id="drunk-driving" title="음주운전" icon="fas fa-car-crash">
            음주운전의 위험성과 예방 방법에 대해 알아보세요.
        </crime-section>

        <crime-section id="violence" title="폭력" icon="fas fa-fist-raised">
            다양한 형태의 폭력을 인지하고 예방하는 방법을 배웁니다.
        </crime-section>

        <crime-section id="sex-crimes" title="성범죄" icon="fas fa-user-secret">
            성범죄, 동의, 생존자 지원에 대한 정보를 제공합니다.
        </crime-section>

        <section id="partnership">
            <h2><i class="fas fa-hands-helping"></i> 제휴 문의</h2>
            <form action="https://formspree.io/f/mnjgojbl" method="POST">
                <label for="name">이름:</label>
                <input type="text" id="name" name="name" required>
                <label for="email">이메일:</label>
                <input type="email" id="email" name="email" required>
                <label for="message">메시지:</label>
                <textarea id="message" name="message" required></textarea>
                <button type="submit">보내기</button>
            </form>
        </section>
    </main>

    <footer>
        <p>&copy; 2024 범죄 예방 교육. All rights reserved.</p>
    </footer>

    <script type="module" src="main.js"></script>
</body>
</html>
